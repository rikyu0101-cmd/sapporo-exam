<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="簿記3級演習">
<meta name="theme-color" content="#0f766e">
<title>日商簿記3級 スマート演習アプリ</title>
<style>
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; background:#f4f7f6; color:#1a2421; display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:20px; }
  .box { max-width:340px; }
  .sp { width:40px; height:40px; border:4px solid #d8e2df; border-top-color:#0f766e; border-radius:50%; margin:0 auto 14px; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .err { color:#dc2626; font-size:13px; margin-top:12px; display:none; }
  button { margin-top:12px; padding:10px 18px; border:none; border-radius:10px; background:#0f766e; color:#fff; font-weight:700; font-size:14px; display:none; }
</style>
</head>
<body>
<div class="box">
  <div class="sp" id="sp"></div>
  <div id="msg" style="font-weight:700;">日商簿記3級アプリを起動中...</div>
  <div class="err" id="err"></div>
  <button id="retry" onclick="location.reload()">再読み込み</button>
</div>
<script>
const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxDSTqcKSEcZLm4MVrew5nYZk3bmzzPYdblQGMUY-WocScvLwwbq80DeR5S6ej553Q6Zg/exec';

(async function boot() {
  try {
    const res = await fetch(GAS_API_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const payload = await res.json();
    if (payload.error) throw new Error(payload.error);
    if (!payload.html) throw new Error('アプリHTMLが取得できませんでした。');

    try {
      sessionStorage.setItem('boki3_api_url', GAS_API_URL);
      if (payload.data) sessionStorage.setItem('boki3_preload_data', JSON.stringify(payload.data));
      localStorage.setItem('boki3_cached_html', payload.html);
    } catch (e) {}

    document.open();
    document.write(payload.html);
    document.close();
  } catch (e) {
    document.getElementById('sp').style.display = 'none';
    document.getElementById('msg').textContent = '起動に失敗しました';
    const errEl = document.getElementById('err');
    errEl.textContent = e.message || String(e);
    errEl.style.display = 'block';
    document.getElementById('retry').style.display = 'inline-block';
  }
})();
</script>
</body>
</html>
